<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="NEAR Insights: a live investment thesis for NEAR, with every claim backed by data. Each thesis has a bull case, a bear case and a breaking point.">
  <!-- Text is set in Plus Jakarta Sans (SIL Open Font License 1.1), embedded as a subset of the letters used here, so it renders where web fonts cannot load. -->
  <defs>
    <style>
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 800; src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
      text { font-family: "Plus Jakarta Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#1ed39b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1ed39b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="#000000"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <g transform="translate(392 52) scale(2.125)">
    <rect x="1.5" y="1.5" width="29" height="29" rx="9" fill="#000000" stroke="#e7e9ea" stroke-width="2.4"/>
    <path d="M10 22V10M22 22V10" fill="none" stroke="#e7e9ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 10l12 12" stroke="#1ed39b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="480" y="108" font-size="60" font-weight="800" letter-spacing="-1.4" fill="#ffffff">NEAR Insights</text>
  <text x="640" y="170" text-anchor="middle" font-size="24" font-weight="400" fill="#c4c8cc">A live investment thesis for NEAR, with every claim backed by data.</text>

  <g transform="translate(112 214)">
    <rect width="332" height="86" rx="18" fill="#00ba7c" fill-opacity="0.12" stroke="#00ba7c" stroke-opacity="0.5"/>
    <rect x="18" y="19" width="48" height="48" rx="12" fill="#00ba7c"/>
    <path transform="translate(30 31)" d="M7 22V11l5-8a2 2 0 0 1 3 1.6V9h5.5a2 2 0 0 1 2 2.4l-1.6 8A2 2 0 0 1 19 21H7zM2 11h3v11H2z" fill="#ffffff"/>
    <text x="84" y="40" font-size="22" font-weight="800" fill="#ffffff">Bull case</text>
    <text x="84" y="66" font-size="16" font-weight="400" fill="#aab4bc">evidence for</text>
  </g>
  <g transform="translate(474 214)">
    <rect width="332" height="86" rx="18" fill="#f4212e" fill-opacity="0.12" stroke="#f4212e" stroke-opacity="0.5"/>
    <rect x="18" y="19" width="48" height="48" rx="12" fill="#f4212e"/>
    <path transform="translate(30 31) rotate(180 12 12.5)" d="M7 22V11l5-8a2 2 0 0 1 3 1.6V9h5.5a2 2 0 0 1 2 2.4l-1.6 8A2 2 0 0 1 19 21H7zM2 11h3v11H2z" fill="#ffffff"/>
    <text x="84" y="40" font-size="22" font-weight="800" fill="#ffffff">Bear case</text>
    <text x="84" y="66" font-size="16" font-weight="400" fill="#aab4bc">evidence against</text>
  </g>
  <g transform="translate(836 214)">
    <rect width="332" height="86" rx="18" fill="#8b98a5" fill-opacity="0.12" stroke="#8b98a5" stroke-opacity="0.5"/>
    <rect x="18" y="19" width="48" height="48" rx="12" fill="#8b98a5"/>
    <path transform="translate(30 31)" d="M5 22V3M5 4h12l-2.5 4.5L17 13H5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="84" y="40" font-size="22" font-weight="800" fill="#ffffff">Breaking point</text>
    <text x="84" y="66" font-size="16" font-weight="400" fill="#aab4bc">what would change the view</text>
